name: Bug Report
description: Create a bug report to help us fix issues.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce this issue.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logs
      description: Paste any relevant non-sensitive logs here.
