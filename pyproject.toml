[project]
name = "enterprise-etl-pipeline-studio"
version = "0.1.0"
description = "Streamlit-based, AI-assisted enterprise ETL and data governance studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Enterprise ETL Pipeline Studio Contributors" }
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    ".github",
    ".streamlit",
    "assets",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "htmlcov",
    "artifacts",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit
]
ignore = [
    "S101", # Use of assert
    "E501", # Line too long
    "RUF001",
    "RUF059",
    "SIM102",
    "S104",
]

[tool.ruff.lint.isort]
known-first-party = ["etl", "ai", "ui", "app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_optional = true
strict_equality = true
warn_unreachable = false
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pydeck.*",
    "pandera.*",
    "duckdb.*",
    "google.*",
    "google.genai.*",
    "polars.*",
    "plotly.*",
    "tenacity.*",
    "pandas.*",
]
ignore_missing_imports = true
